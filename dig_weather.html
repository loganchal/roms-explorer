<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather &middot; ROMS extension domain explorer</title>
    <link rel="stylesheet" href="explorer.css?v=20261112-labels">
    <style>
        body { min-height: 100vh; padding: 24px; }
        #dig-wrap {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
            max-width: 1400px;
            margin: 0 auto;
        }
        #dig-header-card {
            position: sticky;
            top: 24px;
            border-radius: 14px;
            padding: 18px 20px;
        }
        #dig-header-card .field-buttons {
            display: flex;
            border-top: 1px solid var(--line);
        }
        #dig-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }
        .dig-card {
            border-radius: 14px;
            padding: 18px 20px;
        }
        .dig-caption {
            font-size: 12px;
            line-height: 1.55;
            color: var(--muted);
            margin-top: 10px;
        }
        #map-wrap { display: flex; justify-content: center; }
        #map-canvas {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            image-rendering: pixelated;
            background: #050708;
        }
        #map-readout {
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            color: var(--muted);
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }
        #series-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .series-pane .k { font-size: 10.5px; color: var(--muted); margin-bottom: 6px; }
        canvas.dig-chart {
            width: 100%;
            height: 130px;
            background: var(--panel-2);
            border-radius: 6px;
            display: block;
        }
        .dig-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--muted); }
        .dig-legend .sw { display: inline-flex; align-items: center; gap: 6px; }
        .dig-legend .dot { width: 8px; height: 8px; border-radius: 50%; }
        #regrid-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .regrid-pane .k { font-size: 10.5px; color: var(--muted); margin-bottom: 6px; }
        .regrid-pane canvas {
            width: 100%;
            height: auto;
            border-radius: 6px;
            image-rendering: pixelated;
            background: #050708;
            display: block;
        }
        @media (max-width: 860px) {
            #dig-wrap { grid-template-columns: 1fr; }
            #dig-header-card { position: static; }
            #series-grid, #regrid-grid { grid-template-columns: 1fr; }
        }
    </style>
<link rel="stylesheet" href="language.css?v=20261110-reo1"><script defer src="language.js?v=20261112-metocean"></script></head>

<body>
    <div id="dig-wrap">
        <div id="dig-header-card" class="glass">
            <div id="dig-header"></div>
            <div id="field-buttons" class="field-buttons visible"></div>
        </div>
        <div id="dig-content">
            <div id="regrid-card" class="dig-card glass">
                <div id="regrid-grid">
                    <div class="regrid-pane">
                        <div class="k">Native CFSR grid</div>
                        <canvas id="native-canvas"></canvas>
                    </div>
                    <div class="regrid-pane">
                        <div class="k">Regridded onto the model</div>
                        <canvas id="regrid-canvas"></canvas>
                    </div>
                </div>
                <div class="dig-caption">Air temperature, one hour, bilinearly interpolated from the coarse CFSR grid onto the model's 5 km curvilinear grid.</div>
            </div>
            <div id="map-card" class="dig-card glass">
                <div id="map-wrap">
                    <canvas id="map-canvas"></canvas>
                </div>
                <div id="map-readout"></div>
            </div>
            <div id="series-card" class="dig-card glass">
                <div id="series-grid">
                    <div class="series-pane">
                        <div class="k">Wind components (m/s)</div>
                        <canvas id="wind-canvas" class="dig-chart"></canvas>
                        <div class="dig-legend">
                            <span class="sw"><span class="dot" style="background:#4fa8ff"></span>Uwind</span>
                            <span class="sw"><span class="dot" style="background:#f2a63c"></span>Vwind</span>
                        </div>
                    </div>
                    <div class="series-pane">
                        <div class="k">Shortwave (W/m&sup2;)</div>
                        <canvas id="swrad-canvas" class="dig-chart"></canvas>
                    </div>
                </div>
                <div class="dig-caption">Wind components and shortwave at one grid point across the month.</div>
            </div>
        </div>
    </div>

    <div id="err"></div>

    <script src="error_banner.js"></script>
    <script src="scene_data.js"></script>
    <script type="module" src="./dig_weather.js"></script>
</body>

</html>
